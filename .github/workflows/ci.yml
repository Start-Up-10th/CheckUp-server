name: Server CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # contextLoads 테스트가 Flyway·JPA로 DB에 접속하므로 CI 전용 Postgres·Redis를 띄운다.
    # 아래 값은 CI에서만 쓰는 테스트용 값이며 운영 자격증명이 아니다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: checkup
          POSTGRES_USER: checkup
          POSTGRES_PASSWORD: checkup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/checkup
      DB_USERNAME: checkup
      DB_PASSWORD: checkup
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build