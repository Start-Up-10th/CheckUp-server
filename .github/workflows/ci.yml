name: Server CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트는 Testcontainers로 Postgres·Redis를 직접 띄운다. ubuntu-latest에 Docker가 있다.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build