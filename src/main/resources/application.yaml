spring:
  # @Scheduled 작업이 서로 기다리지 않도록 스레드 2개
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: checkup
  # 개인 설정·secret은 커밋하지 않는 application-local.yaml에 둔다. 파일이 없으면 무시한다.
  config:
    import: optional:classpath:application-local.yaml
  # 기본값은 로컬 compose.yaml·CI와 같은 개발용 값이다. 운영 서버는 환경변수로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/checkup}
    username: ${DB_USERNAME:checkup}
    password: ${DB_PASSWORD:checkup}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    data:
      redis:
        namespace: checkup:session
  servlet:
    multipart:
      max-file-size: ${FACE_MAX_UPLOAD_SIZE:60MB}
      max-request-size: ${FACE_MAX_REQUEST_SIZE:60MB}

datagsm:
  client-id: ${DATAGSM_CLIENT_ID}
  client-secret: ${DATAGSM_CLIENT_SECRET}
  api-key: ${DATAGSM_API_KEY} # DataGSM OpenAPI(학생 조회) 전용 키. OAuth client-id와 다른 값이다.
  webhook-secret: ${DATAGSM_WEBHOOK_SECRET}
  redirect-uri: ${DATAGSM_REDIRECT_URI:http://localhost:8080/api/v1/auth/callback}
  connect-timeout: ${DATAGSM_CONNECT_TIMEOUT:3s} # DataGSM 연결 대기 시간
  response-timeout: ${DATAGSM_RESPONSE_TIMEOUT:5s} # DataGSM 응답 대기 시간. 로그인 콜백은 DataGSM을 두 번 불러 최대 (연결+응답)×2 동안 기다린다

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d} # 요청이 없을 때 세션 유지 시간
      cookie:
        http-only: true # JS가 쿠키 못 읽음, XSS 방지
        same-site: lax # 다른 사이트에서 보내는 POST 요청에는 쿠키X -> CSRF 1차 방어
        secure: ${SESSION_COOKIE_SECURE:false} # HTTPS에서만 쿠키 전송, 로컬은 http라 false, 운영에서는 환경변수로 true

# API 문서(/swagger-ui/index.html, /v3/api-docs). 노출하지 않을 환경에서는 SWAGGER_ENABLED=false로 끈다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

checkup:
  admin:
    datagsm-ids: ${CHECKUP_ADMIN_DATAGSM_IDS:}   # 개발·테스트용 관리자 DataGSM 계정 id, 쉼표 구분. 운영 전 비운다
  web:
    base-url: ${PUBLIC_ORIGIN}
  qr:
    token-ttl: 15m
    lease-ttl: 60s
    rotate-before: 30s
    token-retention: 1h
    base-url: ${PUBLIC_ORIGIN}
  face:
    # AI sessions are in-memory; use one AI process or routing sticky to the session_id.
    ai-base-url: ${FACE_AI_BASE_URL:http://localhost:8000}
    service-token: ${FACE_SERVICE_TOKEN}
    connect-timeout: ${FACE_AI_CONNECT_TIMEOUT:2s}
    response-timeout: ${FACE_AI_RESPONSE_TIMEOUT:30s}
    max-upload-bytes: ${FACE_MAX_UPLOAD_BYTES:62914560}
    max-frame-bytes: ${FACE_MAX_FRAME_BYTES:2097152}
    min-frame-interval: ${FACE_MIN_FRAME_INTERVAL:200ms}
    max-concurrent-frames: ${FACE_MAX_CONCURRENT_FRAMES:4}
    session-idle-timeout: ${FACE_SESSION_IDLE_TIMEOUT:5m}
    cleanup-interval-ms: ${FACE_CLEANUP_INTERVAL_MS:60000}
    consent-version: ${FACE_CONSENT_VERSION:v1}
