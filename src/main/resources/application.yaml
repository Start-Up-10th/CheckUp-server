spring:
  # @Scheduled 작업이 서로 기다리지 않도록 스레드 2개
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: checkup
  # 개인 설정·secret은 커밋하지 않는 application-local.yaml에 둔다. 파일이 없으면 무시한다.
  config:
    import: optional:classpath:application-local.yaml
  # 기본값은 로컬 compose.yaml·CI와 같은 개발용 값이다. 운영 서버는 환경변수로 덮어쓴다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/checkup}
    username: ${DB_USERNAME:checkup}
    password: ${DB_PASSWORD:checkup}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 쿼리 수·실행 시간 통계. 지표를 켰을 때만 모은다
        generate_statistics: ${checkup.metrics.enabled}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis가 내려갔을 때 기본 60초를 기다리지 않고 바로 실패하게 한다. 상태 확인이 503을 빨리 준다
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:3s}
  session:
    data:
      redis:
        namespace: checkup:session
  servlet:
    multipart:
      max-file-size: ${FACE_MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${FACE_MAX_REQUEST_SIZE:20MB}

datagsm:
  client-id: ${DATAGSM_CLIENT_ID}
  client-secret: ${DATAGSM_CLIENT_SECRET}
  api-key: ${DATAGSM_API_KEY} # DataGSM OpenAPI(학생 조회) 전용 키. OAuth client-id와 다른 값이다.
  webhook-secret: ${DATAGSM_WEBHOOK_SECRET}
  redirect-uri: ${DATAGSM_REDIRECT_URI:http://localhost:8080/api/v1/auth/callback}
  connect-timeout: ${DATAGSM_CONNECT_TIMEOUT:3s} # DataGSM 연결 대기 시간
  response-timeout: ${DATAGSM_RESPONSE_TIMEOUT:5s} # DataGSM 응답 대기 시간. 로그인 콜백은 DataGSM을 두 번 불러 최대 (연결+응답)×2 동안 기다린다

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:7d} # 요청이 없을 때 세션 유지 시간
      cookie:
        http-only: true # JS가 쿠키 못 읽음, XSS 방지
        same-site: lax # 다른 사이트에서 보내는 POST 요청에는 쿠키X -> CSRF 1차 방어
        secure: ${SESSION_COOKIE_SECURE:false} # HTTPS에서만 쿠키 전송, 로컬은 http라 false, 운영에서는 환경변수로 true

# 상태 확인(/actuator/health)만 연다. 로그인 없이 호출되므로 DB·Redis 주소나 장애 원인은 응답에 넣지 않는다.
# 지표(/actuator/prometheus)는 checkup.metrics.enabled가 true일 때만 생긴다. 꺼져 있으면 그 경로 자체가 없다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  prometheus:
    metrics:
      export:
        enabled: ${checkup.metrics.enabled}
  metrics:
    distribution:
      # API 응답 시간의 p95 같은 분위수를 Prometheus에서 계산할 수 있게 구간별 횟수를 남긴다
      percentiles-histogram:
        http.server.requests: true

# Hibernate 통계를 켜면 트랜잭션마다 찍히는 요약 로그를 끈다. 값은 지표로 본다.
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn

# API 문서(/swagger-ui/index.html, /v3/api-docs). 노출하지 않을 환경에서는 SWAGGER_ENABLED=false로 끈다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

checkup:
  admin:
    datagsm-ids: ${CHECKUP_ADMIN_DATAGSM_IDS:}   # 개발·테스트용 관리자 DataGSM 계정 id, 쉼표 구분. 운영 전 비운다
  web:
    base-url: ${PUBLIC_ORIGIN}
  # Prometheus가 긁어 갈 지표를 /actuator/prometheus로 내보낸다. 켜면 로그인 없이 열리므로 로컬에서만 켠다.
  metrics:
    enabled: ${METRICS_ENABLED:false}
  # 요청마다 DB 쿼리 수와 걸린 시간을 로그로 남긴다. 느린 API를 찾을 때만 켠다.
  query-log:
    enabled: ${QUERY_LOG_ENABLED:false}
  qr:
    token-ttl: 15m
    lease-ttl: 60s
    rotate-before: 30s
    token-retention: 1h
    base-url: ${PUBLIC_ORIGIN}
  face:
    # AI sessions are in-memory; use one AI process or routing sticky to the session_id.
    ai-base-url: ${FACE_AI_BASE_URL:http://host.docker.internal:8000/}
    service-token: ${FACE_SERVICE_TOKEN}
    connect-timeout: ${FACE_AI_CONNECT_TIMEOUT:2s}
    response-timeout: ${FACE_AI_RESPONSE_TIMEOUT:30s}
    max-upload-bytes: ${FACE_MAX_UPLOAD_BYTES:20971520} # 얼굴 등록 영상 한도 20MB. 웹이 지키는 값과 같다
    max-frame-bytes: ${FACE_MAX_FRAME_BYTES:2097152}
    min-frame-interval: ${FACE_MIN_FRAME_INTERVAL:200ms}
    max-concurrent-frames: ${FACE_MAX_CONCURRENT_FRAMES:4}
    # 얼굴 등록 영상을 동시에 받아 처리하는 수. 영상 본문이 메모리에 올라가므로 서버 메모리에 맞춰 정한다
    max-concurrent-enrollments: ${FACE_MAX_CONCURRENT_ENROLLMENTS:3}
    # 자리가 없을 때 바로 거절하지 않고 기다려 주는 시간. 지나면 429와 Retry-After를 준다
    enrollment-wait-timeout: ${FACE_ENROLLMENT_WAIT_TIMEOUT:5s}
    session-idle-timeout: ${FACE_SESSION_IDLE_TIMEOUT:5m}
    cleanup-interval-ms: ${FACE_CLEANUP_INTERVAL_MS:60000}
    consent-version: ${FACE_CONSENT_VERSION:v1}
